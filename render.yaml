services:
  - type: web
    name: flowsync-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_AGENT_URL
        value: https://agent.tinyfish.io/v1/crawl
